

services:
  backend:
    build:
      context: ../mern-demo
    ports:
      - "5000:5000"
    env_file:
      - ../mern-demo/.env
    environment:
      PORT: "5000"
    network_mode: bridge
    dns:
      - 168.63.129.16
    restart: unless-stopped

  frontend:
    build:
      context: ../client
    ports:
      - "5173:5173"
    network_mode: bridge
    links:
      - "backend:backend"
    restart: unless-stopped

