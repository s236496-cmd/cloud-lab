
services:
  backend:
    build:
      context: ./mern-demo
    ports:
      - "5000:5000"
    env_file:
      - ./mern-demo/.env
    environment:
      PORT: "5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped